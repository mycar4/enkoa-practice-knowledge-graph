<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">미술입시 질문</h1>
<p class="font-body-md text-body-md text-on-surface-variant">실측 검증된 대학 공식 모집요강 원문 데이터를 기반으로 답변합니다. 답변에 없는 학교/숫자는 지어내지 않도록 시스템이 제한합니다.</p>

<section class="flex flex-col gap-unit-sm bg-surface-container p-unit-md rounded-xl shadow-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant flex items-center justify-between" for="ai-query"><span>AI 입시 데이터 질의창</span></label>
<div class="relative flex flex-col gap-unit-xs">
<div class="flex items-center bg-surface-container-lowest rounded-lg p-unit-xs shadow-sm">
<span class="material-symbols-outlined text-outline ml-unit-xs">search</span>
<input class="w-full bg-transparent px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="ai-query" placeholder="예: 중앙대 연관 지원가능 학교 알려줘" type="text"/>
<button aria-label="질문 실행" class="h-10 px-unit-md bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center gap-unit-xs shrink-0 transition-transform active:scale-95 shadow-sm" id="ask-button"><span>분석</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
</div>
<div class="flex gap-unit-xs overflow-x-auto py-unit-2xs scrollbar-none" id="suggestChips">
<button class="suggest-chip shrink-0 px-unit-sm py-1 bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-sm text-label-sm rounded-lg transition-colors">한예종 무대미술과와 같은 실기로 지원 가능한 학교는?</button>
<button class="suggest-chip shrink-0 px-unit-sm py-1 bg-surface-container-high hover:bg-surface-container-highest text-on-surface font-label-sm text-label-sm rounded-lg transition-colors">홍익대 미술활동보고서로 지원 가능한 전형 알려줘</button>
</div>
</div>
</section>

<section class="flex flex-col gap-unit-md" id="threadContainer"></section>
</div>

<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]"><div class="grid grid-cols-4 h-16 items-stretch">
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="index.html"><span class="material-symbols-outlined text-[22px]">view_quilt</span><span class="font-label-sm text-label-sm">홈</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="profile.html"><span class="material-symbols-outlined text-[22px]">school</span><span class="font-label-sm text-label-sm">대학 찾기</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-primary bg-surface-container-low font-bold transition-colors min-h-[44px]" href="qa.html"><span class="material-symbols-outlined text-[22px]">forum</span><span class="font-label-sm text-label-sm">입시 질문</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="review.html"><span class="material-symbols-outlined text-[22px]">edit_document</span><span class="font-label-sm text-label-sm">서류 첨삭</span></a>
</div></nav>

<script>
const askBtn = document.getElementById("ask-button");
const queryInput = document.getElementById("ai-query");
const thread = document.getElementById("threadContainer");

document.querySelectorAll(".suggest-chip").forEach(chip => {
  chip.addEventListener("click", () => { queryInput.value = chip.textContent; askQuestion(); });
});
askBtn.addEventListener("click", askQuestion);
queryInput.addEventListener("keydown", e => { if (e.key === "Enter") askQuestion(); });

function formatAnswer(text) {
  return text
    .replace(/</g, "&lt;")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a class="underline text-primary" href="$2" target="_blank" rel="noopener">$1</a>');
}

// 지식그래프 근거 추적 패널 - "AI가 답을 지어낸 게 아니라 그래프에서 이렇게
// 찾아냈다"를 사용자가 직접 눈으로 확인하게 하는 게 핵심 차별화 포인트.
// context_compatible_tracks(실기유형/재료 키워드 구조적 매칭)와
// context_graph_related(동시출현 커뮤니티 연관 학교) 둘 다 순수 그래프 쿼리
// 결과이고 LLM이 만든 게 아니다.
function buildGraphTrace(res) {
  const compatible = res.context_compatible_tracks || [];
  const related = res.context_graph_related || [];
  if (!compatible.length && !related.length) return "";

  const compatRows = compatible.slice(0, 8).map(m => `
    <div class="flex items-start gap-unit-xs">
      <span class="w-2 h-2 rounded-full bg-primary shrink-0 mt-1.5"></span>
      <span class="font-body-sm text-body-sm text-on-surface"><strong>${m.university} ${m.department}</strong> - 공통 키워드 ${(m.shared_keywords || []).concat(m.shared_materials || []).join(", ") || "-"}</span>
    </div>`).join("");

  const relatedChips = related.slice(0, 8).map(r =>
    `<span class="px-unit-xs py-0.5 bg-surface-container text-on-surface font-label-sm text-label-sm rounded">${r.name}${r.community_label ? ` · ${r.community_label}` : ""}</span>`
  ).join("");

  return `
    <div class="border border-outline-variant/40 rounded-lg overflow-hidden">
      <button type="button" class="graph-trace-toggle w-full flex items-center justify-between p-unit-sm bg-surface-container hover:bg-surface-container-high transition-colors">
        <span class="flex items-center gap-unit-xs font-label-md text-label-md text-on-surface font-bold">
          <svg width="16" height="16" viewBox="0 0 16 16"><circle cx="4" cy="8" r="3" fill="#1647D8"/><rect x="10" y="5" width="6" height="6" fill="#151515"/><line x1="7" y1="8" x2="10" y2="8" stroke="#151515" stroke-width="1.5"/></svg>
          <span>🧬 지식그래프가 이 답을 찾아낸 경로</span>
        </span>
        <span class="material-symbols-outlined toggle-icon text-outline">expand_more</span>
      </button>
      <div class="graph-trace-panel hidden p-unit-md space-y-unit-sm bg-surface-container-lowest">
        ${compatRows ? `<div><div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-unit-xs">① 실기유형·재료 키워드로 구조적 매칭된 학교</div><div class="space-y-1">${compatRows}</div></div>` : ""}
        ${relatedChips ? `<div><div class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-unit-xs">② 동시출현 그래프에서 같은 커뮤니티로 연관된 학교/개체</div><div class="flex flex-wrap gap-unit-2xs">${relatedChips}</div></div>` : ""}
        <p class="font-body-sm text-body-sm text-outline">이 목록은 LLM이 아니라 Neo4j 그래프 쿼리 결과 그대로입니다 - AI는 이 결과를 문장으로 풀어 설명했을 뿐, 목록 자체를 만들어내지 않았습니다.</p>
      </div>
    </div>`;
}

function askQuestion() {
  const val = queryInput.value.trim();
  if (!val) return;

  const userBubble = document.createElement("div");
  userBubble.className = "flex items-start gap-unit-sm bg-surface-container-low p-unit-md rounded-xl";
  userBubble.innerHTML = `<div class="w-9 h-9 rounded-full bg-surface-container-highest flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[20px]">person</span></div><p class="font-body-md text-body-md text-on-surface font-semibold">${val}</p>`;
  thread.appendChild(userBubble);

  const aiBox = document.createElement("div");
  aiBox.className = "flex flex-col gap-unit-md bg-surface-container-lowest p-unit-md rounded-xl shadow-md";
  aiBox.innerHTML = `<div class="flex items-center gap-unit-xs"><div class="w-7 h-7 rounded-lg bg-primary-container flex items-center justify-center text-on-primary"><span class="material-symbols-outlined text-[18px]">auto_awesome</span></div><span class="font-label-md text-label-md text-on-surface font-bold">ART:READY AI</span><span class="material-symbols-outlined animate-spin text-outline text-[18px] ml-auto">progress_activity</span></div>`;
  thread.appendChild(aiBox);
  askBtn.disabled = true;

  fetch(window.API_BASE_URL + "/qa", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query: val }),
  }).then(r => r.json()).then(res => {
    const citations = (res.context_tracks || []).map(t =>
      `<div class="flex items-start gap-unit-xs bg-surface-container-lowest p-unit-xs rounded"><span class="material-symbols-outlined text-[16px] text-primary shrink-0 mt-0.5">menu_book</span><span><strong>${t.university} ${t.department}</strong>${t.source_url ? ` - <a class="underline text-primary" href="${t.source_url}" target="_blank" rel="noopener">원문</a>` : ""}</span></div>`
    ).join("");
    aiBox.innerHTML = `
      <div class="flex items-center justify-between pb-unit-xs">
        <div class="flex items-center gap-unit-xs"><div class="w-7 h-7 rounded-lg bg-primary-container flex items-center justify-center text-on-primary"><span class="material-symbols-outlined text-[18px]">auto_awesome</span></div><span class="font-label-md text-label-md text-on-surface font-bold">ART:READY AI</span></div>
        <div class="flex items-center gap-unit-xs">
          <span class="font-label-sm text-label-sm text-outline">${res.model || ""}</span>
          <div class="flex items-center gap-1.5 px-unit-xs py-0.5 bg-primary text-on-primary rounded"><span class="w-2 h-2 rounded-full bg-on-primary animate-pulse"></span><span class="font-label-sm text-label-sm font-bold">RAG VERIFIED</span></div>
        </div>
      </div>
      <div class="bg-surface-container-low p-unit-md rounded-lg font-body-md text-body-md text-on-surface leading-relaxed whitespace-pre-line">${formatAnswer(res.answer || "응답 없음")}</div>
      ${citations ? `<div class="flex flex-col gap-unit-xs bg-surface-container p-unit-md rounded-lg"><div class="flex items-center gap-unit-xs text-primary font-bold font-label-sm text-label-sm"><span class="material-symbols-outlined text-[18px]">verified</span><span>공식 모집요강 추출 근거</span></div><div class="flex flex-col gap-unit-2xs font-body-sm text-body-sm text-on-surface">${citations}</div></div>` : ""}
      ${buildGraphTrace(res)}
      <p class="font-body-sm text-body-sm text-error bg-error-container/30 p-unit-xs rounded">※ 주의: 최종 세부 요강은 해당 대학 입학처의 공식 공지를 반드시 재확인하십시오.</p>
    `;
    const traceToggle = aiBox.querySelector(".graph-trace-toggle");
    if (traceToggle) {
      traceToggle.addEventListener("click", () => {
        const panel = aiBox.querySelector(".graph-trace-panel");
        const open = !panel.classList.contains("hidden");
        panel.classList.toggle("hidden", open);
        traceToggle.querySelector(".toggle-icon").textContent = open ? "expand_more" : "expand_less";
      });
    }
  }).catch(err => {
    aiBox.innerHTML = `<p class="font-body-sm text-body-sm text-error">API 연결 실패: ${err}</p>`;
  }).finally(() => {
    askBtn.disabled = false;
    queryInput.value = "";
  });
}
</script>
</body></html>
