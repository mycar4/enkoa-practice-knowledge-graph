</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">

<a href="index.html" class="flex items-center gap-unit-sm shrink-0"><svg width="28" height="20" viewBox="0 0 72 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#1647D8"/><rect x="26" y="2" width="20" height="20" fill="#151515"/><polygon points="60,2 70,22 50,22" fill="#E34234"/></svg><span class="font-label-lg text-label-lg text-on-surface tracking-wider">ART:READY</span></a>
<nav class="hidden md:flex items-center gap-unit-xl">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" href="index.html">홈</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" href="profile.html">대학 찾기</a>
<a class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" href="qa.html">입시 질문</a>
<a class="font-label-md text-label-md text-primary" href="review.html">서류 첨삭</a>

<main class="flex flex-col relative w-full pt-16 lg:pt-20 pb-24 md:pb-16 bg-surface min-h-screen">
<div class="w-full max-w-[1440px] mx-auto">
<section class="px-margin-mobile lg:px-12 pt-unit-md pb-unit-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">서류/자소서 AI 첨삭</h1>
<p class="font-body-sm text-body-sm text-error bg-error-container/30 p-unit-sm rounded mt-unit-sm lg:max-w-2xl">AI 추정 의견입니다 - 공식 평가/합격 가능성 판정이 아닙니다. 학교를 지정하면 그 학교의 실제 서류 규정 원문을 근거로 첨삭합니다.</p>
</section>

<section class="px-margin-mobile lg:px-12 pb-unit-xl lg:grid lg:grid-cols-2 lg:gap-unit-3xl lg:items-start">
<div class="space-y-unit-md">
<div>
<label class="font-label-lg text-label-lg text-on-surface block mb-unit-xs" for="univSelect">지원 학교 선택 (선택)</label>
<select class="w-full h-11 px-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="univSelect"><option value="">학교 미선택 (일반 첨삭)</option></select>
</div>
<div>
<label class="font-label-lg text-label-lg text-on-surface block mb-unit-xs" for="docType">문서 종류</label>
<select class="w-full h-11 px-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="docType">
<option>자기소개서</option><option>미술활동보고서</option><option>포트폴리오 설명글</option><option>기타 서류</option>
</select>
</div>
<div>
<div class="flex items-center justify-between mb-unit-xs">
<label class="font-label-lg text-label-lg text-on-surface" for="docText">첨삭받을 텍스트</label>
<label class="font-label-sm text-label-sm text-primary underline cursor-pointer" for="docFile">파일에서 불러오기 (.txt)</label>
<input type="file" id="docFile" accept=".txt,text/plain" class="hidden"/>
</div>
<textarea class="w-full h-48 lg:h-64 p-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="docText" placeholder="자기소개서/활동보고서 텍스트를 붙여넣거나, 위에서 .txt 파일을 불러오세요"></textarea>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit-2xs">PDF/한글(.hwp) 파일은 아직 지원하지 않습니다 - 텍스트로 붙여넣거나 .txt로 저장해서 올려주세요.</p>
</div>
<button class="w-full h-13 py-unit-sm bg-on-surface text-surface font-label-lg text-label-lg rounded flex items-center justify-center gap-unit-xs shadow-md" id="reviewBtn"><span>AI 첨삭 받기</span><span class="material-symbols-outlined">arrow_forward</span></button>
</div>
<div id="reviewResult" class="hidden mt-unit-md lg:mt-0 flex flex-col gap-unit-md lg:sticky lg:top-24">
<div id="docRulesBox" class="hidden flex flex-col gap-unit-xs bg-surface-container p-unit-md rounded-lg">
<div class="flex items-center gap-unit-xs text-primary font-bold font-label-sm text-label-sm"><span class="material-symbols-outlined text-[18px]">verified</span><span>이 학교 서류 규정 원문 근거</span></div>
<div id="docRulesList" class="flex flex-col gap-unit-2xs font-body-sm text-body-sm text-on-surface"></div>
</div>
<div id="feedbackBox" class="bg-surface-container-lowest p-unit-md rounded-lg shadow-md font-body-md text-body-md text-on-surface leading-relaxed whitespace-pre-line"></div>
<div id="chatThread" class="flex flex-col gap-unit-sm"></div>
<div id="chatInputBox" class="hidden flex items-center gap-unit-xs bg-surface-container-lowest rounded-lg p-unit-xs shadow-sm">
<input class="w-full bg-transparent px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="chatInput" placeholder="첨삭에 대해 더 물어보세요 (예: 이 문장 더 구체적으로 고쳐줘)" type="text"/>
<button class="h-10 px-unit-md bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center gap-unit-xs shrink-0" id="chatSendBtn"><span class="material-symbols-outlined text-[18px]">send</span></button>
</div>
</div>
</section>
</div>
</main>

<nav class="md:hidden fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]"><div class="grid grid-cols-4 h-16 items-stretch">
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="index.html"><span class="material-symbols-outlined text-[22px]">view_quilt</span><span class="font-label-sm text-label-sm">홈</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="profile.html"><span class="material-symbols-outlined text-[22px]">school</span><span class="font-label-sm text-label-sm">대학 찾기</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="qa.html"><span class="material-symbols-outlined text-[22px]">forum</span><span class="font-label-sm text-label-sm">입시 질문</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-primary bg-surface-container-low font-bold transition-colors min-h-[44px]" href="review.html"><span class="material-symbols-outlined text-[22px]">edit_document</span><span class="font-label-sm text-label-sm">서류 첨삭</span></a>
</div></nav>

<script>
fetch(window.API_BASE_URL + "/universities").then(r => r.json()).then(list => {
  const sel = document.getElementById("univSelect");
  list.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u.university; opt.textContent = u.display_name || u.university;
    sel.appendChild(opt);
  });
}).catch(() => {});

document.getElementById("docFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { document.getElementById("docText").value = reader.result; };
  reader.readAsText(file, "utf-8");
});

let chatHistory = [];
let currentDocText = "";
let currentDocType = "자기소개서";

function formatFeedback(text) {
  return (text || "")
    .replace(/</g, "&lt;")
    .replace(/^### (.+)$/gm, '<strong class="block mt-unit-sm">$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

function appendChatBubble(role, content) {
  const thread = document.getElementById("chatThread");
  const bubble = document.createElement("div");
  if (role === "user") {
    bubble.className = "flex items-start gap-unit-sm bg-surface-container-low p-unit-sm rounded-xl self-end max-w-[90%]";
    bubble.innerHTML = `<p class="font-body-md text-body-md text-on-surface">${content.replace(/</g, "&lt;")}</p>`;
  } else {
    bubble.className = "bg-surface-container-lowest p-unit-sm rounded-xl shadow-sm font-body-md text-body-md text-on-surface leading-relaxed whitespace-pre-line";
    bubble.innerHTML = formatFeedback(content);
  }
  thread.appendChild(bubble);
  return bubble;
}

document.getElementById("reviewBtn").addEventListener("click", () => {
  const text = document.getElementById("docText").value.trim();
  const university = document.getElementById("univSelect").value;
  const docType = document.getElementById("docType").value;
  const resultBox = document.getElementById("reviewResult");
  const feedbackBox = document.getElementById("feedbackBox");
  const docRulesBox = document.getElementById("docRulesBox");
  const docRulesList = document.getElementById("docRulesList");
  if (!text) { alert("첨삭할 텍스트를 입력해주세요."); return; }

  const btn = document.getElementById("reviewBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>AI 첨삭 중...</span>';
  resultBox.classList.remove("hidden");
  document.getElementById("chatThread").innerHTML = "";
  document.getElementById("chatInputBox").classList.add("hidden");

  fetch(window.API_BASE_URL + "/review-document", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, doc_type: docType, university: university || null }),
  }).then(r => r.json()).then(res => {
    feedbackBox.innerHTML = formatFeedback(res.feedback || "응답 없음");

    const rules = res.doc_rules || [];
    if (rules.length) {
      docRulesList.innerHTML = rules.map(r =>
        `<div class="flex items-start gap-unit-xs bg-surface-container-lowest p-unit-xs rounded"><span class="material-symbols-outlined text-[16px] text-primary shrink-0 mt-0.5">menu_book</span><span>p.${r.page_start}-${r.page_end}: ${(r.text || "").slice(0, 200).replace(/</g, "&lt;")}...</span></div>`
      ).join("");
      docRulesBox.classList.remove("hidden");
    } else if (university) {
      docRulesList.innerHTML = `<span class="text-on-surface-variant">이 학교의 서류 규정 원문을 색인에서 찾지 못해 일반 글쓰기 관점으로만 첨삭했습니다.</span>`;
      docRulesBox.classList.remove("hidden");
    } else {
      docRulesBox.classList.add("hidden");
    }

    currentDocText = text;
    currentDocType = docType;
    chatHistory = [{ role: "assistant", content: res.feedback || "" }];
    document.getElementById("chatInputBox").classList.remove("hidden");
  }).catch(err => {
    feedbackBox.textContent = "API 연결 실패: " + err;
  }).finally(() => {
    btn.disabled = false;
    btn.innerHTML = '<span>AI 첨삭 받기</span><span class="material-symbols-outlined">arrow_forward</span>';
  });
});

function sendChatMessage() {
  const input = document.getElementById("chatInput");
  const msg = input.value.trim();
  if (!msg) return;
  appendChatBubble("user", msg);
  chatHistory.push({ role: "user", content: msg });
  input.value = "";
  const sendBtn = document.getElementById("chatSendBtn");
  sendBtn.disabled = true;
  const aiBubble = appendChatBubble("assistant", "…생각 중");

  fetch(window.API_BASE_URL + "/review-chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ doc_text: currentDocText, doc_type: currentDocType, history: chatHistory }),
  }).then(r => r.json()).then(res => {
    const reply = res.reply || "응답 없음";
    aiBubble.textContent = reply;
    chatHistory.push({ role: "assistant", content: reply });
  }).catch(err => {
    aiBubble.textContent = "API 연결 실패: " + err;
  }).finally(() => {
    sendBtn.disabled = false;
  });
}
document.getElementById("chatSendBtn").addEventListener("click", sendChatMessage);
document.getElementById("chatInput").addEventListener("keydown", e => { if (e.key === "Enter") sendChatMessage(); });
</script>
</body></html>
