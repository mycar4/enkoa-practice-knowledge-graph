<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>ART BAUHAUS - 서류 첨삭</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet"/>
<style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{"colors":{"surface-container-lowest":"#ffffff","outline":"#747686","surface-variant":"#e5e2e1","surface-container-low":"#f6f3f2","primary-container":"#1647d8","on-background":"#1c1b1b","background":"#fcf9f8","on-primary":"#ffffff","primary":"#0031ab","on-surface":"#1c1b1b","error":"#ba1a1a","surface-container-highest":"#e5e2e1","surface-container":"#f0edec","on-surface-variant":"#434655","secondary":"#b72119","on-secondary":"#ffffff","surface-container-high":"#eae7e7","surface":"#fcf9f8"},"borderRadius":{"DEFAULT":"0.125rem","lg":"0.25rem","xl":"0.5rem","full":"0.75rem"},"spacing":{"gutter-mobile":"1rem","unit-md":"1rem","margin-desktop":"3rem","unit-xl":"2rem","unit-3xl":"4rem","unit-lg":"1.5rem","unit-xs":"0.25rem","unit-sm":"0.5rem","gutter-desktop":"1.5rem","margin-mobile":"1.25rem","unit-2xl":"3rem","unit-2xs":"0.125rem"},"fontFamily":{"label-lg":["Space Grotesk"],"headline-md":["Noto Sans"],"body-lg":["Noto Sans"],"label-md":["Space Grotesk"],"headline-lg":["Noto Sans"],"body-md":["Noto Sans"],"headline-sm":["Noto Sans"],"display-xl-mobile":["Space Grotesk"],"body-sm":["Noto Sans"],"label-sm":["Space Grotesk"],"display-xl":["Space Grotesk"],"headline-lg-mobile":["Noto Sans"]},"fontSize":{"label-lg":["14px",{"lineHeight":"18px","letterSpacing":"0.05em","fontWeight":"700"}],"headline-md":["24px",{"lineHeight":"32px","letterSpacing":"-0.01em","fontWeight":"700"}],"body-lg":["17px",{"lineHeight":"26px","letterSpacing":"-0.01em","fontWeight":"400"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.06em","fontWeight":"600"}],"headline-lg":["36px",{"lineHeight":"46px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-md":["15px",{"lineHeight":"24px","letterSpacing":"0em","fontWeight":"400"}],"headline-sm":["20px",{"lineHeight":"28px","letterSpacing":"0em","fontWeight":"600"}],"display-xl-mobile":["38px",{"lineHeight":"44px","letterSpacing":"-0.02em","fontWeight":"700"}],"body-sm":["13px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"400"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.08em","fontWeight":"700"}],"display-xl":["56px",{"lineHeight":"64px","letterSpacing":"-0.03em","fontWeight":"700"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}]}}}}</script>
<script src="config.js"></script>
</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-unit-sm"><svg width="28" height="20" viewBox="0 0 72 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#1647D8"/><rect x="26" y="2" width="20" height="20" fill="#151515"/><polygon points="60,2 70,22 50,22" fill="#E34234"/></svg><div class="flex flex-col"><span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">ART BAUHAUS</span><span class="font-label-sm text-label-sm text-on-surface-variant font-bold">Document Review</span></div></div></div></header>

<main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
<section class="px-margin-mobile pt-unit-md pb-unit-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">서류/자소서 AI 첨삭</h1>
<p class="font-body-sm text-body-sm text-error bg-error-container/30 p-unit-sm rounded mt-unit-sm">AI 추정 의견입니다 - 공식 평가/합격 가능성 판정이 아닙니다. 학교를 지정하면 그 학교의 실제 서류 규정 원문을 근거로 첨삭합니다.</p>
</section>

<section class="px-margin-mobile space-y-unit-md pb-unit-xl">
<div>
<label class="font-label-lg text-label-lg text-on-surface block mb-unit-xs" for="univSelect">지원 학교 선택 (선택)</label>
<select class="w-full h-11 px-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="univSelect"><option value="">학교 미선택 (일반 첨삭)</option></select>
</div>
<div>
<label class="font-label-lg text-label-lg text-on-surface block mb-unit-xs" for="docType">문서 종류</label>
<select class="w-full h-11 px-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="docType">
<option>자기소개서</option><option>미술활동보고서</option><option>포트폴리오 설명글</option><option>기타 서류</option>
</select>
</div>
<div>
<label class="font-label-lg text-label-lg text-on-surface block mb-unit-xs" for="docText">첨삭받을 텍스트</label>
<textarea class="w-full h-48 p-unit-sm bg-surface-container-lowest border border-outline-variant rounded font-body-md text-body-md" id="docText" placeholder="자기소개서/활동보고서 텍스트를 붙여넣으세요"></textarea>
</div>
<button class="w-full h-13 py-unit-sm bg-on-surface text-surface font-label-lg text-label-lg rounded flex items-center justify-center gap-unit-xs shadow-md" id="reviewBtn"><span>AI 첨삭 받기</span><span class="material-symbols-outlined">arrow_forward</span></button>
<div id="reviewResult" class="hidden bg-surface-container-lowest p-unit-md rounded-lg shadow-md font-body-md text-body-md text-on-surface leading-relaxed whitespace-pre-line"></div>
</section>
</main>

<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]"><div class="grid grid-cols-4 h-16 items-stretch">
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="index.html"><span class="material-symbols-outlined text-[22px]">view_quilt</span><span class="font-label-sm text-label-sm">홈</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="profile.html"><span class="material-symbols-outlined text-[22px]">school</span><span class="font-label-sm text-label-sm">대학 찾기</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="qa.html"><span class="material-symbols-outlined text-[22px]">forum</span><span class="font-label-sm text-label-sm">입시 질문</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-primary bg-surface-container-low font-bold transition-colors min-h-[44px]" href="review.html"><span class="material-symbols-outlined text-[22px]">edit_document</span><span class="font-label-sm text-label-sm">서류 첨삭</span></a>
</div></nav>

<script>
fetch(window.API_BASE_URL + "/universities").then(r => r.json()).then(list => {
  const sel = document.getElementById("univSelect");
  list.forEach(u => {
    const opt = document.createElement("option");
    opt.value = u.university; opt.textContent = u.display_name || u.university;
    sel.appendChild(opt);
  });
}).catch(() => {});

document.getElementById("reviewBtn").addEventListener("click", () => {
  const text = document.getElementById("docText").value.trim();
  const university = document.getElementById("univSelect").value;
  const docType = document.getElementById("docType").value;
  const resultBox = document.getElementById("reviewResult");
  if (!text) { alert("첨삭할 텍스트를 입력해주세요."); return; }

  const btn = document.getElementById("reviewBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span><span>AI 첨삭 중...</span>';

  fetch(window.API_BASE_URL + "/review-document", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text, doc_type: docType, university: university || null }),
  }).then(r => r.json()).then(res => {
    resultBox.textContent = res.feedback || "응답 없음";
    resultBox.classList.remove("hidden");
  }).catch(err => {
    resultBox.textContent = "API 연결 실패: " + err;
    resultBox.classList.remove("hidden");
  }).finally(() => {
    btn.disabled = false;
    btn.innerHTML = '<span>AI 첨삭 받기</span><span class="material-symbols-outlined">arrow_forward</span>';
  });
});
</script>
</body></html>
