<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">대학-학과-전형 지도</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit-2xs">
"학교별 보기"에서 관심 있는 대학을, "실기종목별 보기"에서 준비 중인 실기종목을 고르면 연결된 학과·전형을

동그라미를 클릭하면 자세한 내용을 확인할 수 있습니다.

<div class="mt-unit-md p-unit-sm bg-surface-container-lowest border border-outline-variant/40 rounded flex flex-col gap-unit-sm">

<script>
let kgNetworkInstance = null;
let kgFullGraph = null; // 마지막으로 서버에서 받아온 원본 그래프
let kgActiveTab = "university"; // "university" | "topic"

const DEPTH_ORDER = { topic: -1, university: 0, department: 1, track: 2 };

// 성적추천 화면(grades.html)에서 계산을 한 번이라도 돌렸다면 sessionStorage에
// 그 성적이 남아있다 - 같은 브라우저 탭 안에서라면 KG 뷰어에서도 재입력 없이
// 바로 그 성적으로 학생부 환산 툴팁을 붙일 수 있다.
function getSavedGrades() {
  try {
    const raw = sessionStorage.getItem("artready_recommend_grades");
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function currentDepth() {
  const checked = document.querySelector('input[name="kgDepth"]:checked');
  return checked ? checked.value : "track";
}

// depth까지만 노드/엣지를 남긴 부분 그래프를 만든다("topic"의 실기종목 루트
// 노드는 항상 남긴다). 서버는 항상 전체 구조를 내려주고, 화면에서 무엇을
// 보여줄지만 필터링한다.
function filterByDepth(graphData, depth) {
  const maxLevel = DEPTH_ORDER[depth];
  const keptIds = new Set(graphData.nodes.filter(n => DEPTH_ORDER[n.group] <= maxLevel).map(n => n.id));
  return {
    nodes: graphData.nodes.filter(n => keptIds.has(n.id)),
    edges: graphData.edges.filter(e => keptIds.has(e.from) && keptIds.has(e.to)),
  };
}

function renderGraph(graphData) {
  const container = document.getElementById("kgNetwork");
  const colorByGroup = { topic: "#0a7d3c", university: "#0031ab", department: "#b72119", track: "#1c1b1b" };
  const sizeByGroup = { topic: 30, university: 26, department: 18, track: 12 };
  const nodes = new vis.DataSet(graphData.nodes.map(n => ({
    ...n,
    color: { background: colorByGroup[n.group] || "#747686", border: colorByGroup[n.group] || "#747686" },
    // 흰 배경 위 흰 글씨라 안 보이던 문제 수정 - 라벨은 진한 글씨로, 어두운
    // 노드 배경과 겹치지 않도록 노드 주변에 밝은 테두리를 살짝 둔다.
    font: { color: "#1c1b1b", size: n.group === "university" ? 15 : (n.group === "department" ? 13 : 11), strokeWidth: 3, strokeColor: "#fcf9f8" },
    shape: "dot",
    size: sizeByGroup[n.group] || 12,
    // 전형 노드에 학생부 환산 결과가 있으면(title) 마우스오버 시 브라우저
    // 기본 툴팁으로 뜬다 - vis.js가 title 속성을 그대로 사용.
    title: n.title || undefined,
  })));
  const edges = new vis.DataSet(graphData.edges.map(e => ({ ...e, color: { color: "#c9c6c5" } })));

  document.getElementById("kgTrackCount").textContent =
    `대학 ${graphData.nodes.filter(n => n.group === "university").length}개 · 학과 ${graphData.nodes.filter(n => n.group === "department").length}개 · 전형 ${graphData.nodes.filter(n => n.group === "track").length}개`;

  if (kgNetworkInstance) kgNetworkInstance.destroy();
  kgNetworkInstance = new vis.Network(container, { nodes, edges }, {
    layout: { improvedLayout: true },
    physics: { solver: "forceAtlas2Based", forceAtlas2Based: { springLength: 120, avoidOverlap: 0.6 }, stabilization: { iterations: 150 } },
    interaction: { hover: true, tooltipDelay: 100 },
    nodes: { borderWidth: 1 },
  });

  kgNetworkInstance.on("click", (params) => {
    const panel = document.getElementById("kgDetailPanel");
    if (!params.nodes.length) { panel.classList.add("hidden"); return; }
    const node = graphData.nodes.find(n => n.id === params.nodes[0]);
    if (!node) return;
    const groupLabel = { topic: "실기종목", university: "대학", department: "학과", track: "전형" }[node.group] || "";
    document.getElementById("kgDetailTitle").textContent = `${groupLabel} · ${node.label}`;
    let body = "연결된 하위 항목을 펼쳐서 구조를 확인해보세요.";
    if (node.group === "track") {
      body = node.title
        ? node.title + "\n\n자세한 모집요강 원문·반영비율은 '대학 찾기'에서 해당 대학을 검색해 확인하세요."
        : "이 전형의 모집요강 원문·반영비율 등 자세한 내용은 '대학 찾기'에서 해당 대학을 검색해 확인하세요.";
    }
    document.getElementById("kgDetailBody").textContent = body;
    panel.classList.remove("hidden");
  });
}

function applyDepthAndRender() {
  if (!kgFullGraph) return;
  renderGraph(filterByDepth(kgFullGraph, currentDepth()));
}

function loadGraph(body) {
  const errEl = document.getElementById("kgError");
  errEl.classList.add("hidden");
  document.getElementById("kgDetailPanel").classList.add("hidden");
  fetch(window.API_BASE_URL + "/kg-graph/scored", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  }).then(r => r.json()).then(graphData => {
    if (!graphData.nodes || !graphData.nodes.length) {
      errEl.textContent = "조건에 맞는 데이터를 찾을 수 없습니다.";
      errEl.classList.remove("hidden");
      return;
    }
    kgFullGraph = graphData;
    // 대학 전체(university=null)나 실기종목별 보기를 한 번에 볼 때는 전형까지
    // 다 펼치면 너무 빽빽해서 아무것도 안 보이므로 기본값을 "학과까지"로
    // 낮춘다. 사용자가 직접 "전형까지"를 눌러 더 자세히 볼 수는 있다.
    if (!body.university) {
      const trackRadio = document.querySelector('input[name="kgDepth"][value="track"]');
      const deptRadio = document.querySelector('input[name="kgDepth"][value="department"]');
      if (trackRadio.checked) deptRadio.checked = true;
    }
    applyDepthAndRender();
  }).catch(() => {
    errEl.textContent = "지도를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
    errEl.classList.remove("hidden");
  });
}

function loadCurrentSelection() {
  const grades = getSavedGrades();
  if (kgActiveTab === "university") {
    const university = document.getElementById("kgUnivSelect").value;
    loadGraph({ university: university || null, grades });
  } else {
    const topic = document.getElementById("kgTopicSelect").value;
    if (!topic) return;
    loadGraph({ topic_keyword: topic, grades });
  }
}

document.querySelectorAll(".kgDepthRadio").forEach(r => r.addEventListener("change", applyDepthAndRender));

function setActiveTab(tab) {
  kgActiveTab = tab;
  const isUniv = tab === "university";
  document.getElementById("kgUnivPanel").classList.toggle("hidden", !isUniv);
  document.getElementById("kgTopicPanel").classList.toggle("hidden", isUniv);
  document.getElementById("kgTabUniv").className = "kgTabBtn h-9 px-unit-sm rounded font-label-sm text-label-sm " + (isUniv ? "bg-primary text-on-primary" : "bg-surface-container-high text-on-surface-variant");
  document.getElementById("kgTabTopic").className = "kgTabBtn h-9 px-unit-sm rounded font-label-sm text-label-sm " + (!isUniv ? "bg-primary text-on-primary" : "bg-surface-container-high text-on-surface-variant");
  loadCurrentSelection();
}
document.getElementById("kgTabUniv").addEventListener("click", () => setActiveTab("university"));
document.getElementById("kgTabTopic").addEventListener("click", () => setActiveTab("topic"));

// 성적 반영 안내 - 성적이 있으면 실제로 붙는다는 걸, 없으면 어디서 넣을 수
// 있는지 알려준다(있는 척하지 않는다).
const savedGradesOnLoad = getSavedGrades();
document.getElementById("kgGradeStatus").innerHTML = savedGradesOnLoad
  ? `<span class="material-symbols-outlined text-[16px] text-primary align-middle">verified</span> 학생부 성적이 반영되어 있습니다 - 전형 노드에 마우스를 올리면 환산 결과가 보입니다.`
  : `<a href="grades.html" class="text-primary underline">성적 추천</a>에서 먼저 성적을 계산하면, 이 지도의 전형 노드에도 학생부 환산 결과가 함께 표시됩니다.`;

fetch(window.API_BASE_URL + "/universities").then(r => r.json()).then(list => {
  const names = [...new Set(list.map(u => u.university))].sort();
  const select = document.getElementById("kgUnivSelect");
  select.innerHTML = `<option value="">🗺️ 전체 대학 한번에 보기</option>` + names.map(n => `<option value="${n}">${n}</option>`).join("");
  select.value = names[0];
  select.addEventListener("change", loadCurrentSelection);
  if (names.length) loadCurrentSelection();
}).catch(() => {
  document.getElementById("kgError").textContent = "대학 목록을 불러오지 못했습니다.";
  document.getElementById("kgError").classList.remove("hidden");
});

fetch(window.API_BASE_URL + "/prep-topics").then(r => r.json()).then(topics => {
  const select = document.getElementById("kgTopicSelect");
  select.innerHTML = topics.map(t => `<option value="${t}">${t}</option>`).join("");
  select.addEventListener("change", loadCurrentSelection);
}).catch(() => { /* 실기종목 탭을 안 누르면 영향 없음 */ });
</script>
