acing":"-0.02em","fontWeight":"700"}],"body-sm":["13px",{"lineHeight":"20px","letterSpacing":"0.01em","fontWeight":"400"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.08em","fontWeight":"700"}],"display-xl":["56px",{"lineHeight":"64px","letterSpacing":"-0.03em","fontWeight":"700"}],"headline-lg-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.01em","fontWeight":"700"}]}}}}</script>

</head><body class="bg-surface font-body-md text-body-md text-on-surface flex flex-col min-h-screen">
<header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter-mobile flex items-center justify-between"><div class="flex items-center gap-unit-sm"><svg width="28" height="20" viewBox="0 0 72 24" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="10" fill="#1647D8"/><rect x="26" y="2" width="20" height="20" fill="#151515"/><polygon points="60,2 70,22 50,22" fill="#E34234"/></svg><div class="flex flex-col"><span class="font-label-md text-label-md text-on-surface uppercase tracking-wider">ART BAUHAUS</span><span class="font-label-sm text-label-sm text-on-surface-variant font-bold">Match Result</span></div></div>
<a href="profile.html" class="h-11 px-unit-sm rounded bg-surface-container text-on-surface font-label-sm text-label-sm flex items-center gap-unit-xs">다시 분석</a>
</div></header>

<main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
<section class="px-margin-mobile pt-unit-md pb-unit-sm">
<div class="inline-flex items-center gap-unit-xs px-unit-sm py-unit-2xs bg-surface-container-high rounded text-on-surface mb-unit-xs"><span class="w-2 h-2 rounded-full bg-primary inline-block"></span><span class="font-label-sm text-label-sm uppercase tracking-wider text-on-surface-variant">RAG Intelligence Report</span></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight" id="profileSummary">분석 결과</h1>
<div class="grid grid-cols-2 gap-unit-xs mt-unit-md">
<div class="bg-surface-container-lowest p-unit-sm rounded shadow-sm text-center"><div id="resultCount" class="font-headline-sm text-headline-sm text-primary">0</div><div class="font-label-sm text-label-sm text-on-surface-variant">호환 전형</div></div>
<div class="bg-surface-container-lowest p-unit-sm rounded shadow-sm text-center"><div id="resultUnivCount" class="font-headline-sm text-headline-sm text-primary">0</div><div class="font-label-sm text-label-sm text-on-surface-variant">해당 대학 수</div></div>
</div>
</section>

<section class="px-margin-mobile pt-unit-sm space-y-unit-sm" id="cardsContainer">
<!-- JS로 실제 API 결과를 채운다 -->
</section>

<div id="emptyState" class="px-margin-mobile py-unit-2xl text-center hidden">
<p class="font-body-md text-body-md text-on-surface-variant">적재된 데이터 범위 내에서는 조건에 맞는 학교를 찾지 못했습니다.<br/>다른 실기 종목이나 재료로 다시 시도해보세요.</p>
</div>
</main>

<nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/95 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.04)]"><div class="grid grid-cols-4 h-16 items-stretch">
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="index.html"><span class="material-symbols-outlined text-[22px]">view_quilt</span><span class="font-label-sm text-label-sm">홈</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-primary bg-surface-container-low font-bold transition-colors min-h-[44px]" href="profile.html"><span class="material-symbols-outlined text-[22px]">school</span><span class="font-label-sm text-label-sm">대학 찾기</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="qa.html"><span class="material-symbols-outlined text-[22px]">forum</span><span class="font-label-sm text-label-sm">입시 질문</span></a>
<a class="flex flex-col items-center justify-center gap-unit-2xs text-on-surface-variant hover:text-on-surface transition-colors min-h-[44px]" href="review.html"><span class="material-symbols-outlined text-[22px]">edit_document</span><span class="font-label-sm text-label-sm">서류 첨삭</span></a>
</div></nav>

<script>
const raw = sessionStorage.getItem("art_bauhaus_results");
const profileRaw = sessionStorage.getItem("art_bauhaus_profile");
const results = raw ? JSON.parse(raw) : [];
const profile = profileRaw ? JSON.parse(profileRaw) : null;

if (profile) {
  const bits = [];
  if (profile.examTypes && profile.examTypes.length) bits.push(profile.examTypes.join("·"));
  if (profile.materialQuery) bits.push("재료: " + profile.materialQuery);
  if (profile.documentOnly) bits.push("서류전형만");
  document.getElementById("profileSummary").textContent = bits.length ? bits.join(" / ") + " 기준 결과" : "분석 결과";
}

document.getElementById("resultCount").textContent = results.length;
document.getElementById("resultUnivCount").textContent = new Set(results.map(r => r.university)).size;

const container = document.getElementById("cardsContainer");
if (results.length === 0) {
  document.getElementById("emptyState").classList.remove("hidden");
} else {
  results.forEach(r => {
    const card = document.createElement("div");
    card.className = "flex flex-col bg-surface-container-lowest rounded-lg p-unit-md gap-unit-xs shadow-sm border border-outline-variant/30";
    const cutoffLabel = (r.cutoff_grade_estimate !== null && r.cutoff_grade_estimate !== undefined)
      ? `작년 입시결과 기준 예상 ${r.cutoff_grade_estimate}등급 (추정치, 공식 아님)`
      : "예상등급 정보 없음";
    const campusStr = r.campus ? ` (${r.campus}캠퍼스)` : "";
    const matchedStr = (r.matched_keywords && r.matched_keywords.length) ? r.matched_keywords.join(", ") : "-";
    card.innerHTML = `
      <div class="flex items-center justify-between">
        <span class="font-headline-sm text-headline-sm text-on-surface">${r.university}${campusStr}</span>
        <span class="px-unit-xs py-0.5 bg-surface-variant text-on-surface-variant font-label-sm text-label-sm rounded">${r.admission_year || "-"}학년도</span>
      </div>
      <div class="font-body-md text-body-md text-on-surface font-medium">${r.department}</div>
      <div class="font-body-sm text-body-sm text-on-surface-variant">${r.exam_type_name || "-"}</div>
      ${r.is_document_based ? "" : `<div class="font-label-sm text-label-sm text-primary">겹치는 키워드: ${matchedStr}</div>`}
      <div class="px-unit-xs py-1 bg-surface-container text-on-surface-variant font-label-sm text-label-sm rounded w-fit">${cutoffLabel}</div>
      ${r.source_url ? `<a class="font-label-sm text-label-sm text-primary underline" href="${r.source_url}" target="_blank" rel="noopener">공식 모집요강 원문 보기</a>` : ""}
    `;
    container.appendChild(card);
  });
}
</script>
</body></html>
