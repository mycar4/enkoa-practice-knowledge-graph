<main class="flex flex-col relative w-full pt-16 lg:pt-20 pb-24 md:pb-16 bg-surface min-h-screen">
<div class="flex flex-col w-full max-w-3xl mx-auto px-gutter-mobile lg:px-12 gap-unit-lg pb-unit-xl">

<section class="flex flex-col gap-unit-xs pt-unit-sm">
<div class="flex items-center gap-unit-xs"><span class="inline-block w-2.5 h-2.5 bg-primary-container"></span><span class="font-label-sm text-label-sm text-primary uppercase tracking-wider">ART:READY</span></div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">1:1 상담신청</h1>
<p class="font-body-md text-body-md text-on-surface-variant">더 깊은 상담이 필요하시면 전문 컨설턴트가 직접 답변드립니다. 회원가입 없이 이용하실 수 있으며, 작성 시 정한 비밀번호로만 내 글과 답변을 확인할 수 있습니다.</p>
</section>

<section class="flex justify-end">
<button id="writeBtn" type="button" class="h-10 px-unit-md bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center gap-unit-xs shrink-0 transition-transform active:scale-95 shadow-sm"><span class="material-symbols-outlined text-[18px]">edit</span><span>상담 신청하기</span></button>
</section>

<!-- 글쓰기 폼 -->
<section id="writeForm" class="hidden flex-col gap-unit-sm bg-surface-container p-unit-md rounded-xl shadow-sm">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-unit-sm">
    <label class="flex flex-col gap-unit-2xs"><span class="font-label-sm text-label-sm text-on-surface-variant">이름</span>
      <input id="fName" type="text" class="bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface focus:outline-none" /></label>
    <label class="flex flex-col gap-unit-2xs"><span class="font-label-sm text-label-sm text-on-surface-variant">연락처</span>
      <input id="fContact" type="text" placeholder="휴대폰 또는 이메일" class="bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" /></label>
  </div>
  <label class="flex flex-col gap-unit-2xs"><span class="font-label-sm text-label-sm text-on-surface-variant">제목</span>
    <input id="fTitle" type="text" class="bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface focus:outline-none" /></label>
  <label class="flex flex-col gap-unit-2xs"><span class="font-label-sm text-label-sm text-on-surface-variant">문의 내용</span>
    <textarea id="fContent" rows="5" class="bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface focus:outline-none resize-y"></textarea></label>
  <label class="flex flex-col gap-unit-2xs max-w-xs"><span class="font-label-sm text-label-sm text-on-surface-variant">비밀번호 (4자 이상, 열람 시 필요)</span>
    <input id="fPassword" type="password" class="bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface focus:outline-none" /></label>
  <p id="writeError" class="hidden font-body-sm text-body-sm text-error"></p>
  <div class="flex gap-unit-xs justify-end">
    <button id="writeCancelBtn" type="button" class="h-10 px-unit-md font-label-md text-label-md text-on-surface-variant rounded-lg">취소</button>
    <button id="writeSubmitBtn" type="button" class="h-10 px-unit-md bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm">등록</button>
  </div>
</section>

<!-- 목록 -->
<section class="flex flex-col gap-unit-xs">
  <div id="listLoading" class="font-body-sm text-body-sm text-on-surface-variant py-unit-md text-center">불러오는 중...</div>
  <div id="listEmpty" class="hidden font-body-sm text-body-sm text-on-surface-variant py-unit-md text-center">아직 등록된 상담신청이 없습니다.</div>
  <ul id="inquiryList" class="flex flex-col gap-0 bg-surface-container-lowest rounded-xl shadow-sm divide-y divide-outline-variant/20 overflow-hidden"></ul>
</section>

</div>
</main>

<script>
const API = window.API_BASE_URL;
const writeBtn = document.getElementById("writeBtn");
const writeForm = document.getElementById("writeForm");
const writeCancelBtn = document.getElementById("writeCancelBtn");
const writeSubmitBtn = document.getElementById("writeSubmitBtn");
const writeError = document.getElementById("writeError");
const listEl = document.getElementById("inquiryList");
const listLoading = document.getElementById("listLoading");
const listEmpty = document.getElementById("listEmpty");

writeBtn.addEventListener("click", () => {
  writeForm.classList.toggle("hidden");
  writeForm.classList.toggle("flex");
});
writeCancelBtn.addEventListener("click", () => {
  writeForm.classList.add("hidden");
  writeForm.classList.remove("flex");
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

writeSubmitBtn.addEventListener("click", () => {
  const name = document.getElementById("fName").value.trim();
  const contact = document.getElementById("fContact").value.trim();
  const title = document.getElementById("fTitle").value.trim();
  const content = document.getElementById("fContent").value.trim();
  const password = document.getElementById("fPassword").value;
  writeError.classList.add("hidden");
  if (!name || !contact || !title || !content) {
    writeError.textContent = "이름/연락처/제목/문의내용을 모두 입력해주세요.";
    writeError.classList.remove("hidden");
    return;
  }
  if (!password || password.length < 4) {
    writeError.textContent = "비밀번호는 4자 이상 입력해주세요.";
    writeError.classList.remove("hidden");
    return;
  }
  writeSubmitBtn.disabled = true;
  fetch(API + "/inquiries", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, contact, title, question_content: content, password }),
  }).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.detail || "등록 실패"); });
    return r.json();
  }).then(() => {
    ["fName", "fContact", "fTitle", "fContent", "fPassword"].forEach(id => document.getElementById(id).value = "");
    writeForm.classList.add("hidden");
    writeForm.classList.remove("flex");
    loadList();
  }).catch(err => {
    writeError.textContent = String(err.message || err);
    writeError.classList.remove("hidden");
  }).finally(() => { writeSubmitBtn.disabled = false; });
});

function renderRow(item) {
  const li = document.createElement("li");
  li.className = "flex flex-col";
  const statusBadge = item.status === "답변완료"
    ? '<span class="font-label-sm text-label-sm text-primary bg-primary-container/15 px-unit-xs py-0.5 rounded-full shrink-0">답변완료</span>'
    : '<span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-unit-xs py-0.5 rounded-full shrink-0">답변대기</span>';
  const date = (item.created_at || "").slice(0, 10);
  li.innerHTML = `
    <button type="button" class="rowToggle w-full flex items-center gap-unit-sm p-unit-sm text-left hover:bg-surface-container-low transition-colors">
      <span class="material-symbols-outlined text-outline text-[18px] shrink-0">lock</span>
      <span class="flex-1 font-body-md text-body-md text-on-surface truncate">${escapeHtml(item.title)}</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant shrink-0">${escapeHtml(item.name)}</span>
      <span class="font-label-sm text-label-sm text-outline shrink-0">${date}</span>
      ${statusBadge}
    </button>
    <div class="viewPanel hidden flex-col gap-unit-sm px-unit-md pb-unit-md">
      <div class="flex gap-unit-xs items-center">
        <input type="password" placeholder="비밀번호 입력" class="pwInput flex-1 bg-surface-container-lowest rounded-lg px-unit-sm py-unit-xs font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" />
        <button type="button" class="pwSubmit h-9 px-unit-sm bg-primary text-on-primary font-label-md text-label-md rounded-lg shrink-0">확인</button>
      </div>
      <p class="pwError hidden font-body-sm text-body-sm text-error"></p>
      <div class="contentBox hidden flex-col gap-unit-sm bg-surface-container-low rounded-lg p-unit-sm"></div>
    </div>`;
  const toggle = li.querySelector(".rowToggle");
  const panel = li.querySelector(".viewPanel");
  toggle.addEventListener("click", () => {
    panel.classList.toggle("hidden");
    panel.classList.toggle("flex");
  });
  const pwInput = li.querySelector(".pwInput");
  const pwSubmit = li.querySelector(".pwSubmit");
  const pwError = li.querySelector(".pwError");
  const contentBox = li.querySelector(".contentBox");
  function submitPw() {
    const password = pwInput.value;
    pwError.classList.add("hidden");
    if (!password) return;
    pwSubmit.disabled = true;
    fetch(API + `/inquiries/${item.id}/view`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    }).then(r => {
      if (r.status === 403) throw new Error("비밀번호가 일치하지 않습니다.");
      if (!r.ok) throw new Error("조회에 실패했습니다.");
      return r.json();
    }).then(detail => {
      contentBox.innerHTML = `
        <p class="font-label-sm text-label-sm text-on-surface-variant">문의 내용</p>
        <p class="font-body-md text-body-md text-on-surface whitespace-pre-wrap">${escapeHtml(detail.question_content)}</p>
        ${detail.answer_content ? `
          <div class="border-t border-outline-variant/20 pt-unit-sm mt-unit-2xs">
            <p class="font-label-sm text-label-sm text-primary">컨설턴트 답변</p>
            <p class="font-body-md text-body-md text-on-surface whitespace-pre-wrap">${escapeHtml(detail.answer_content)}</p>
          </div>` : `<p class="font-body-sm text-body-sm text-on-surface-variant">아직 답변이 등록되지 않았습니다.</p>`}
      `;
      contentBox.classList.remove("hidden");
      contentBox.classList.add("flex");
    }).catch(err => {
      pwError.textContent = String(err.message || err);
      pwError.classList.remove("hidden");
    }).finally(() => { pwSubmit.disabled = false; });
  }
  pwSubmit.addEventListener("click", submitPw);
  pwInput.addEventListener("keydown", e => { if (e.key === "Enter") submitPw(); });
  return li;
}

function loadList() {
  listLoading.classList.remove("hidden");
  listEmpty.classList.add("hidden");
  listEl.innerHTML = "";
  fetch(API + "/inquiries").then(r => r.json()).then(rows => {
    listLoading.classList.add("hidden");
    if (!rows.length) {
      listEmpty.classList.remove("hidden");
      return;
    }
    rows.forEach(item => listEl.appendChild(renderRow(item)));
  }).catch(() => {
    listLoading.textContent = "목록을 불러오지 못했습니다. 잠시 후 다시 시도해주세요.";
  });
}
loadList();
</script>
