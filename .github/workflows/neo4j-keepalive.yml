name: Neo4j Aura Keepalive

# Neo4j Aura 무료 티어는 일정 기간 쿼리가 없으면 인스턴스를 자동 일시정지한다.
# 새 비밀값 없이(이미 배포된 API 서버가 실제 Neo4j 자격증명을 들고 있으므로)
# 그 API의 실제 DB 조회 엔드포인트(/stats)를 하루 2번 호출해 살아있게 유지한다.
# 실패해도 워크플로 자체를 실패시키지 않는다(디스코드/슬랙 알림 등은 아직 없음 -
# 필요해지면 이 파일에 실패 알림 스텝을 추가).
on:
  schedule:
    - cron: "0 1 * * *"   # 매일 10:00 KST
    - cron: "0 13 * * *"  # 매일 22:00 KST
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /stats to keep Neo4j Aura warm
        run: |
          curl -sf --max-time 30 https://api.unsuzone.com/art-admission/stats || echo "ping failed (non-fatal)"
